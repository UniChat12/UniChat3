services:
  deps:
    image: node:20-alpine
    container_name: anfeelgram-deps
    working_dir: /app
    command: sh -c "npm install"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules

  postgres:
    image: postgres:16-alpine
    container_name: anfeelgram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anfeelgram
      POSTGRES_PASSWORD: anfeelgram
      POSTGRES_DB: anfeelgram
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anfeelgram -d anfeelgram"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anfeelgram-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: node:20-alpine
    container_name: anfeelgram-api
    working_dir: /app
    restart: unless-stopped
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DATABASE_URL: postgresql://anfeelgram:anfeelgram@postgres:5432/anfeelgram?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change-me-access
      JWT_REFRESH_SECRET: change-me-refresh
      OTP_TTL_SECONDS: 120
      OTP_MAX_ATTEMPTS: 5
      OTP_ALLOW_ANY_CODE: "true"
      SMS_PROVIDER: mock
      CLOUD_PASSWORD_MIN_LENGTH: 10
      MAX_IMAGE_SIZE_MB: 10
      ALLOWED_IMAGE_MIME: image/jpeg,image/png,image/webp
      UPLOAD_DIR: /app/uploads
      CORS_ORIGIN: http://localhost
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - uploads_data:/app/uploads
    command: sh -c "npm run prisma:generate -w apps/api && npm run prisma:db:push -w apps/api && npm run dev -w apps/api"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: node:20-alpine
    container_name: anfeelgram-web
    working_dir: /app
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost/api
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "npm run dev -w apps/web -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"

  nginx:
    image: nginx:1.27-alpine
    container_name: anfeelgram-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  node_modules:
  pg_data:
  redis_data:
  uploads_data:
